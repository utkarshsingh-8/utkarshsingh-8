<svg viewBox="0 0 400 420" xmlns="http://www.w3.org/2000/svg" width="400" height="420">
  <defs>
    <style>
      @keyframes float {
        0%,100% { transform: translateY(0px); }
        50%      { transform: translateY(-12px); }
      }
      @keyframes pulse-eye {
        0%,100% { r: 7; opacity: 0.9; }
        50%      { r: 9; opacity: 1; }
      }
      @keyframes pulse-core {
        0%,100% { r: 8; opacity: 0.8; }
        50%      { r: 11; opacity: 1; }
      }
      @keyframes blink-antenna {
        0%,90%,100% { opacity: 1; r: 6; }
        95%          { opacity: 0.2; r: 4; }
      }
      @keyframes scan {
        0%   { transform: translateY(0px); opacity: 0; }
        10%  { opacity: 0.4; }
        90%  { opacity: 0.4; }
        100% { transform: translateY(58px); opacity: 0; }
      }
      @keyframes glow-shadow {
        0%,100% { opacity: 0.35; transform: scaleX(0.85); }
        50%      { opacity: 0.65; transform: scaleX(1.05); }
      }
      @keyframes status-fill {
        0%   { width: 0; }
        60%  { width: 52px; }
        80%  { width: 52px; }
        100% { width: 0; }
      }
      @keyframes dot-blink-1 {
        0%,100% { opacity: 0.3; } 50% { opacity: 1; }
      }
      @keyframes dot-blink-2 {
        0%,100% { opacity: 1; } 50% { opacity: 0.3; }
      }
      @keyframes orbit-inner {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      @keyframes orbit-outer {
        from { transform: rotate(0deg); }
        to   { transform: rotate(-360deg); }
      }
      @keyframes counter-inner {
        from { transform: rotate(0deg); }
        to   { transform: rotate(-360deg); }
      }
      @keyframes counter-outer {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      @keyframes welcome-fade {
        0%,100% { opacity: 0.6; }
        50%      { opacity: 1; }
      }
      @keyframes particle {
        0%   { transform: translateY(0) translateX(0); opacity: 0.6; }
        100% { transform: translateY(-60px) translateX(10px); opacity: 0; }
      }
      @keyframes particle2 {
        0%   { transform: translateY(0) translateX(0); opacity: 0.5; }
        100% { transform: translateY(-50px) translateX(-12px); opacity: 0; }
      }
      @keyframes particle3 {
        0%   { transform: translateY(0) translateX(0); opacity: 0.4; }
        100% { transform: translateY(-40px) translateX(8px); opacity: 0; }
      }

      .bot-group { animation: float 3.5s ease-in-out infinite; transform-origin: 200px 220px; }
      .eye-left  { animation: pulse-eye 2.5s ease-in-out infinite; }
      .eye-right { animation: pulse-eye 2.5s ease-in-out infinite 0.3s; }
      .core      { animation: pulse-core 2s ease-in-out infinite; }
      .antenna-dot { animation: blink-antenna 3s ease-in-out infinite; }
      .scanline  { animation: scan 3.5s ease-in-out infinite; }
      .shadow    { animation: glow-shadow 3.5s ease-in-out infinite; }
      .dot-l     { animation: dot-blink-1 1.5s ease-in-out infinite; }
      .dot-r     { animation: dot-blink-2 1.5s ease-in-out infinite; }
      .welcome-txt { animation: welcome-fade 2.5s ease-in-out infinite; }
      .p1 { animation: particle  2.8s ease-out infinite; }
      .p2 { animation: particle2 3.2s ease-out infinite 0.8s; }
      .p3 { animation: particle3 2.5s ease-out infinite 1.4s; }

      .orbit-g-inner { animation: orbit-inner 12s linear infinite; transform-origin: 200px 190px; }
      .orbit-g-outer { animation: orbit-outer 18s linear infinite; transform-origin: 200px 190px; }
      .icon-counter-inner { animation: counter-inner 12s linear infinite; transform-origin: 0px 0px; }
      .icon-counter-outer { animation: counter-outer 18s linear infinite; transform-origin: 0px 0px; }
    </style>

    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020409"/>
      <stop offset="100%" stop-color="#0d0a1f"/>
    </linearGradient>
    <linearGradient id="headGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0d0a1f"/>
    </linearGradient>
    <linearGradient id="faceGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d2060"/>
      <stop offset="100%" stop-color="#1a1040"/>
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="antennaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="shadowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gridGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.02"/>
    </linearGradient>

    <filter id="glow-sm">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-md">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-lg">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="faceClip">
      <rect x="128" y="128" width="144" height="96" rx="14"/>
    </clipPath>
    <clipPath id="statusClip">
      <rect x="148" y="208" width="104" height="12" rx="5"/>
    </clipPath>
  </defs>

  <!-- background -->
  <rect width="400" height="420" fill="url(#bgGrad)" rx="16"/>

  <!-- grid lines -->
  <g opacity="0.5">
    <line x1="0" y1="80"  x2="400" y2="80"  stroke="#7c3aed" stroke-width="0.4" stroke-dasharray="4,8" opacity="0.15"/>
    <line x1="0" y1="160" x2="400" y2="160" stroke="#7c3aed" stroke-width="0.4" stroke-dasharray="4,8" opacity="0.10"/>
    <line x1="0" y1="240" x2="400" y2="240" stroke="#7c3aed" stroke-width="0.4" stroke-dasharray="4,8" opacity="0.08"/>
    <line x1="0" y1="320" x2="400" y2="320" stroke="#7c3aed" stroke-width="0.4" stroke-dasharray="4,8" opacity="0.06"/>
    <line x1="80"  y1="0" x2="80"  y2="420" stroke="#7c3aed" stroke-width="0.4" stroke-dasharray="4,8" opacity="0.08"/>
    <line x1="160" y1="0" x2="160" y2="420" stroke="#7c3aed" stroke-width="0.4" stroke-dasharray="4,8" opacity="0.06"/>
    <line x1="240" y1="0" x2="240" y2="420" stroke="#7c3aed" stroke-width="0.4" stroke-dasharray="4,8" opacity="0.06"/>
    <line x1="320" y1="0" x2="320" y2="420" stroke="#7c3aed" stroke-width="0.4" stroke-dasharray="4,8" opacity="0.08"/>
  </g>

  <!-- ambient glow blobs -->
  <ellipse cx="200" cy="200" rx="130" ry="100" fill="#7c3aed" opacity="0.04"/>
  <ellipse cx="120" cy="280" rx="60" ry="40" fill="#60a5fa" opacity="0.04"/>
  <ellipse cx="300" cy="280" rx="60" ry="40" fill="#a78bfa" opacity="0.04"/>

  <!-- particle dots rising from core -->
  <circle class="p1" cx="195" cy="305" r="2" fill="#a78bfa"/>
  <circle class="p2" cx="205" cy="300" r="1.5" fill="#7c3aed"/>
  <circle class="p3" cx="200" cy="308" r="1" fill="#c4b5fd"/>

  <!-- orbit ring 1 (inner) -->
  <g class="orbit-g-inner">
    <!-- ring guide (faint) -->
    <circle cx="200" cy="190" r="105" fill="none" stroke="#7c3aed" stroke-width="0.5" stroke-dasharray="3,7" opacity="0.3"/>
    <!-- icon nodes -->
    <g class="icon-counter-inner" style="transform-origin:200px 85px">
      <rect x="188" y="73" width="24" height="24" rx="7" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1.2"/>
      <text x="200" y="89" text-anchor="middle" font-size="13" font-family="serif">🧠</text>
    </g>
    <g class="icon-counter-inner" style="transform-origin:305px 190px">
      <rect x="293" y="178" width="24" height="24" rx="7" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1.2"/>
      <text x="305" y="194" text-anchor="middle" font-size="13" font-family="serif">⚡</text>
    </g>
    <g class="icon-counter-inner" style="transform-origin:200px 295px">
      <rect x="188" y="283" width="24" height="24" rx="7" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1.2"/>
      <text x="200" y="299" text-anchor="middle" font-size="13" font-family="serif">🔬</text>
    </g>
    <g class="icon-counter-inner" style="transform-origin:95px 190px">
      <rect x="83" y="178" width="24" height="24" rx="7" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1.2"/>
      <text x="95" y="194" text-anchor="middle" font-size="13" font-family="serif">🤖</text>
    </g>
  </g>

  <!-- orbit ring 2 (outer) -->
  <g class="orbit-g-outer">
    <circle cx="200" cy="190" r="148" fill="none" stroke="#60a5fa" stroke-width="0.5" stroke-dasharray="2,9" opacity="0.2"/>
    <g class="icon-counter-outer" style="transform-origin:200px 42px">
      <rect x="188" y="30" width="24" height="24" rx="7" fill="#0d1117" stroke="#60a5fa" stroke-width="1"/>
      <text x="200" y="46" text-anchor="middle" font-size="12" font-family="serif">🐍</text>
    </g>
    <g class="icon-counter-outer" style="transform-origin:348px 190px">
      <rect x="336" y="178" width="24" height="24" rx="7" fill="#0d1117" stroke="#60a5fa" stroke-width="1"/>
      <text x="348" y="194" text-anchor="middle" font-size="12" font-family="serif">🔥</text>
    </g>
    <g class="icon-counter-outer" style="transform-origin:200px 338px">
      <rect x="188" y="326" width="24" height="24" rx="7" fill="#0d1117" stroke="#60a5fa" stroke-width="1"/>
      <text x="200" y="342" text-anchor="middle" font-size="12" font-family="serif">🧬</text>
    </g>
    <g class="icon-counter-outer" style="transform-origin:52px 190px">
      <rect x="40" y="178" width="24" height="24" rx="7" fill="#0d1117" stroke="#60a5fa" stroke-width="1"/>
      <text x="52" y="194" text-anchor="middle" font-size="12" font-family="serif">📡</text>
    </g>
  </g>

  <!-- ── BOT ── -->
  <g class="bot-group">

    <!-- shadow -->
    <ellipse class="shadow" cx="200" cy="318" rx="52" ry="8" fill="url(#shadowGrad)"/>

    <!-- antenna -->
    <line x1="200" y1="110" x2="200" y2="86" stroke="url(#antennaGrad)" stroke-width="3" stroke-linecap="round"/>
    <circle class="antenna-dot" cx="200" cy="80" r="6" fill="#a78bfa" filter="url(#glow-md)"/>
    <circle cx="200" cy="80" r="11" fill="#7c3aed" opacity="0.2" filter="url(#glow-lg)">
      <animate attributeName="r" values="9;14;9" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.35;0.15" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- ears -->
    <rect x="112" y="132" width="16" height="36" rx="7" fill="#1a1040" stroke="#4c1d95" stroke-width="1.5"/>
    <rect x="116" y="141" width="6" height="10" rx="3" fill="#7c3aed" opacity="0.65"/>
    <rect x="272" y="132" width="16" height="36" rx="7" fill="#1a1040" stroke="#4c1d95" stroke-width="1.5"/>
    <rect x="278" y="141" width="6" height="10" rx="3" fill="#7c3aed" opacity="0.65"/>

    <!-- head -->
    <rect x="120" y="110" width="160" height="120" rx="22" fill="url(#headGrad)" stroke="#4c1d95" stroke-width="1.5"/>

    <!-- face plate -->
    <rect x="128" y="120" width="144" height="100" rx="14" fill="url(#faceGrad)"/>

    <!-- scan line -->
    <rect class="scanline" x="128" y="120" width="144" height="4" rx="2" fill="#a78bfa" opacity="0.3" clip-path="url(#faceClip)"/>

    <!-- eye sockets -->
    <rect x="143" y="139" width="40" height="26" rx="11" fill="#0d0a1f" stroke="#4c1d95" stroke-width="1"/>
    <rect x="217" y="139" width="40" height="26" rx="11" fill="#0d0a1f" stroke="#4c1d95" stroke-width="1"/>

    <!-- eye glow halos -->
    <ellipse cx="163" cy="152" rx="13" ry="9" fill="#7c3aed" opacity="0.18"/>
    <ellipse cx="237" cy="152" rx="13" ry="9" fill="#7c3aed" opacity="0.18"/>

    <!-- pupils -->
    <circle class="eye-left"  cx="163" cy="152" r="7" fill="url(#eyeGrad)" filter="url(#glow-sm)"/>
    <circle class="eye-right" cx="237" cy="152" r="7" fill="url(#eyeGrad)" filter="url(#glow-sm)"/>
    <circle cx="165" cy="150" r="2" fill="white" opacity="0.6"/>
    <circle cx="239" cy="150" r="2" fill="white" opacity="0.6"/>

    <!-- status bar -->
    <rect x="148" y="182" width="104" height="12" rx="5" fill="#0d0a1f" stroke="#4c1d95" stroke-width="1"/>
    <rect x="150" y="184" width="0" height="8" rx="3" fill="#7c3aed" opacity="0.9" clip-path="url(#statusClip)">
      <animate attributeName="width" values="0;100;0" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="200" y="193" text-anchor="middle" font-size="7" fill="#a78bfa" font-family="monospace" opacity="0.7">PROCESSING</text>

    <!-- neck -->
    <rect x="178" y="230" width="44" height="14" rx="5" fill="#1a1040" stroke="#4c1d95" stroke-width="1"/>
    <rect x="183" y="233" width="7" height="8" rx="2" fill="#7c3aed" opacity="0.5"/>
    <rect x="196" y="233" width="7" height="8" rx="2" fill="#7c3aed" opacity="0.5"/>
    <rect x="209" y="233" width="7" height="8" rx="2" fill="#7c3aed" opacity="0.5"/>

    <!-- body / chest -->
    <rect x="140" y="244" width="120" height="64" rx="16" fill="url(#headGrad)" stroke="#4c1d95" stroke-width="1.5"/>
    <rect x="150" y="252" width="100" height="46" rx="10" fill="#0a0818"/>

    <!-- chest circuit lines -->
    <line x1="163" y1="275" x2="237" y2="275" stroke="#4c1d95" stroke-width="0.8" opacity="0.5"/>
    <line x1="163" y1="266" x2="200" y2="266" stroke="#4c1d95" stroke-width="0.8" opacity="0.4"/>
    <line x1="200" y1="284" x2="237" y2="284" stroke="#4c1d95" stroke-width="0.8" opacity="0.4"/>
    <circle cx="163" cy="266" r="2" fill="#4c1d95"/>
    <circle cx="237" cy="284" r="2" fill="#4c1d95"/>

    <!-- core gem -->
    <circle cx="200" cy="275" r="14" fill="#0a0818" stroke="#7c3aed" stroke-width="1.5"/>
    <circle class="core" cx="200" cy="275" r="8" fill="#7c3aed" filter="url(#glow-md)"/>
    <circle cx="200" cy="275" r="14" fill="#7c3aed" opacity="0.08" filter="url(#glow-lg)"/>

    <!-- side status dots -->
    <circle class="dot-l" cx="162" cy="275" r="4" fill="#a78bfa" filter="url(#glow-sm)"/>
    <circle class="dot-r" cx="238" cy="275" r="4" fill="#60a5fa" filter="url(#glow-sm)"/>

    <!-- corner bolts -->
    <circle cx="156" cy="256" r="2.5" fill="#2d2060"/>
    <circle cx="244" cy="256" r="2.5" fill="#2d2060"/>
    <circle cx="156" cy="296" r="2.5" fill="#2d2060"/>
    <circle cx="244" cy="296" r="2.5" fill="#2d2060"/>

  </g>

  <!-- welcome text bottom -->
  <text class="welcome-txt" x="200" y="388" text-anchor="middle"
    font-size="11" font-family="monospace" letter-spacing="3"
    fill="#a78bfa" font-weight="500">◆  WELCOME TO MY PROFILE  ◆</text>

  <text x="200" y="408" text-anchor="middle"
    font-size="9.5" font-family="monospace" letter-spacing="1.5"
    fill="#4c1d95" opacity="0.7">AI ENGINEER  ·  CELLOGEN THERAPEUTICS</text>

</svg>
