<svg viewBox="0 0 460 500" xmlns="http://www.w3.org/2000/svg" width="460" height="500">
<defs>
  <style>
    @keyframes float{0%,100%{transform:translateY(0) rotate(-.8deg);transform-box:fill-box;transform-origin:50% 50%;}50%{transform:translateY(-14px) rotate(.8deg);transform-box:fill-box;transform-origin:50% 50%;}}
    @keyframes pe{0%,100%{r:8;opacity:.9;}50%{r:10.5;opacity:1;}}
    @keyframes pe2{0%,100%{r:8;opacity:.9;}50%{r:10.5;opacity:1;}}
    @keyframes pc{0%,100%{r:9;opacity:.8;}50%{r:13;opacity:1;}}
    @keyframes pa{0%,90%,100%{opacity:1;r:6;}95%{opacity:.1;r:4;}}
    @keyframes sc{0%{transform:translateY(0);opacity:0;}12%{opacity:.55;}88%{opacity:.55;}100%{transform:translateY(70px);opacity:0;}}
    @keyframes bd1{0%,100%{opacity:.2;}50%{opacity:1;}}
    @keyframes bd2{0%,100%{opacity:1;}50%{opacity:.2;}}
    @keyframes shad{0%,100%{opacity:.35;rx:48;}50%{opacity:.75;rx:58;}}
    @keyframes status{0%{width:0;}55%{width:96px;}80%{width:96px;}100%{width:0;}}
    @keyframes orbit-cw{from{transform:rotate(0deg);transform-origin:230px 220px;}to{transform:rotate(360deg);transform-origin:230px 220px;}}
    @keyframes orbit-ccw{from{transform:rotate(0deg);transform-origin:230px 220px;}to{transform:rotate(-360deg);transform-origin:230px 220px;}}
    @keyframes ci{from{transform:rotate(0deg);}to{transform:rotate(-360deg);}}
    @keyframes co{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
    @keyframes welcome{0%,100%{opacity:.6;}50%{opacity:1;}}
    @keyframes p1{0%{transform:translate(0,0);opacity:.7;}100%{transform:translate(8px,-65px);opacity:0;}}
    @keyframes p2{0%{transform:translate(0,0);opacity:.6;}100%{transform:translate(-10px,-55px);opacity:0;}}
    @keyframes p3{0%{transform:translate(0,0);opacity:.5;}100%{transform:translate(5px,-45px);opacity:0;}}
    @keyframes shimmer{0%,100%{stop-color:#e2d9f3;}50%{stop-color:#67e8f9;}}

    .bot-g{animation:float 3.8s ease-in-out infinite;}
    .eye-l{animation:pe 2.6s ease-in-out infinite;}
    .eye-r{animation:pe2 2.6s ease-in-out infinite .35s;}
    .core-c{animation:pc 2.2s ease-in-out infinite;}
    .ant-d{animation:pa 3s ease-in-out infinite;}
    .scan{animation:sc 3.6s ease-in-out infinite;}
    .dot-l{animation:bd1 1.6s ease-in-out infinite;}
    .dot-r{animation:bd2 1.6s ease-in-out infinite;}
    .shad-e{animation:shad 3.8s ease-in-out infinite;}
    .oi{animation:orbit-cw 13s linear infinite;}
    .oo{animation:orbit-ccw 19s linear infinite;}
    .cni{animation:ci 13s linear infinite;}
    .cno{animation:co 19s linear infinite;}
    .wt{animation:welcome 2.8s ease-in-out infinite;}
    .px1{animation:p1 2.8s ease-out infinite;}
    .px2{animation:p2 3.3s ease-out infinite .9s;}
    .px3{animation:p3 2.5s ease-out infinite 1.6s;}
  </style>

  <!-- gradients -->
  <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#030010"/>
    <stop offset="100%" stop-color="#000208"/>
  </linearGradient>
  <radialGradient id="amb1" cx="30%" cy="25%" r="55%">
    <stop offset="0%" stop-color="#4c1d95" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#4c1d95" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="amb2" cx="75%" cy="75%" r="50%">
    <stop offset="0%" stop-color="#0e7490" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="amb3" cx="50%" cy="50%" r="40%">
    <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.07"/>
    <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="hgrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#160c38"/>
    <stop offset="100%" stop-color="#06030f"/>
  </linearGradient>
  <linearGradient id="fgrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#22125a"/>
    <stop offset="100%" stop-color="#0e0828"/>
  </linearGradient>
  <linearGradient id="egrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#67e8f9"/>
    <stop offset="50%" stop-color="#a78bfa"/>
    <stop offset="100%" stop-color="#7c3aed"/>
  </linearGradient>
  <linearGradient id="cgrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#06b6d4"/>
    <stop offset="100%" stop-color="#7c3aed"/>
  </linearGradient>
  <linearGradient id="agrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#67e8f9"/>
    <stop offset="100%" stop-color="#4c1d95"/>
  </linearGradient>
  <linearGradient id="shad-g" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#7c3aed" stop-opacity="0"/>
    <stop offset="30%" stop-color="#7c3aed" stop-opacity="0.65"/>
    <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.55"/>
    <stop offset="70%" stop-color="#7c3aed" stop-opacity="0.65"/>
    <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="namegrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#e2d9f3">
      <animate attributeName="stop-color" values="#e2d9f3;#67e8f9;#a78bfa;#e2d9f3" dur="5s" repeatCount="indefinite"/>
    </stop>
    <stop offset="50%" stop-color="#a78bfa"/>
    <stop offset="100%" stop-color="#67e8f9">
      <animate attributeName="stop-color" values="#67e8f9;#a78bfa;#e2d9f3;#67e8f9" dur="5s" repeatCount="indefinite"/>
    </stop>
  </linearGradient>
  <radialGradient id="ehalo" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.28"/>
    <stop offset="100%" stop-color="#67e8f9" stop-opacity="0"/>
  </radialGradient>

  <!-- filters -->
  <filter id="f1"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="f2"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="f3"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="fc"><rect x="148" y="140" width="164" height="104" rx="15"/></clipPath>
  <clipPath id="sc"><rect x="168" y="230" width="124" height="14" rx="6"/></clipPath>
</defs>

<!-- ── BACKGROUND ── -->
<rect width="460" height="500" fill="url(#bg1)" rx="18"/>
<rect width="460" height="500" fill="url(#amb1)" rx="18"/>
<rect width="460" height="500" fill="url(#amb2)" rx="18"/>
<rect width="460" height="500" fill="url(#amb3)" rx="18"/>

<!-- hex grid -->
<g opacity="1">
  <line x1="0" y1="83" x2="460" y2="83" stroke="#7c3aed" stroke-width=".35" stroke-dasharray="3,9" opacity=".12"/>
  <line x1="0" y1="166" x2="460" y2="166" stroke="#7c3aed" stroke-width=".35" stroke-dasharray="3,9" opacity=".08"/>
  <line x1="0" y1="249" x2="460" y2="249" stroke="#7c3aed" stroke-width=".35" stroke-dasharray="3,9" opacity=".07"/>
  <line x1="0" y1="332" x2="460" y2="332" stroke="#7c3aed" stroke-width=".35" stroke-dasharray="3,9" opacity=".06"/>
  <line x1="0" y1="415" x2="460" y2="415" stroke="#7c3aed" stroke-width=".35" stroke-dasharray="3,9" opacity=".05"/>
  <line x1="77" y1="0" x2="77" y2="500" stroke="#7c3aed" stroke-width=".35" stroke-dasharray="3,9" opacity=".07"/>
  <line x1="154" y1="0" x2="154" y2="500" stroke="#7c3aed" stroke-width=".35" stroke-dasharray="3,9" opacity=".06"/>
  <line x1="230" y1="0" x2="230" y2="500" stroke="#7c3aed" stroke-width=".35" stroke-dasharray="3,9" opacity=".06"/>
  <line x1="307" y1="0" x2="307" y2="500" stroke="#7c3aed" stroke-width=".35" stroke-dasharray="3,9" opacity=".06"/>
  <line x1="383" y1="0" x2="383" y2="500" stroke="#7c3aed" stroke-width=".35" stroke-dasharray="3,9" opacity=".07"/>
</g>

<!-- corner accents -->
<path d="M0 0 L40 0 L40 4 L4 4 L4 40 L0 40Z" fill="#7c3aed" opacity=".35"/>
<path d="M460 0 L420 0 L420 4 L456 4 L456 40 L460 40Z" fill="#7c3aed" opacity=".35"/>
<path d="M0 500 L40 500 L40 496 L4 496 L4 460 L0 460Z" fill="#06b6d4" opacity=".25"/>
<path d="M460 500 L420 500 L420 496 L456 496 L456 460 L460 460Z" fill="#06b6d4" opacity=".25"/>

<!-- particles floating up -->
<circle class="px1" cx="226" cy="378" r="2.5" fill="#a78bfa"/>
<circle class="px2" cx="234" cy="372" r="1.8" fill="#06b6d4"/>
<circle class="px3" cx="230" cy="382" r="1.2" fill="#c4b5fd"/>

<!-- ── ORBIT RING 1 (inner, 120px radius) ── -->
<g class="oi">
  <circle cx="230" cy="220" r="122" fill="none" stroke="#7c3aed" stroke-width=".6" stroke-dasharray="3,8" opacity=".3"/>
  <g class="cni" style="transform-origin:230px 98px">
    <rect x="216" y="84" width="28" height="28" rx="8" fill="#060314" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="230" y="102" text-anchor="middle" font-size="16">🧠</text>
  </g>
  <g class="cni" style="transform-origin:352px 220px">
    <rect x="338" y="206" width="28" height="28" rx="8" fill="#060314" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="352" y="224" text-anchor="middle" font-size="16">⚡</text>
  </g>
  <g class="cni" style="transform-origin:230px 342px">
    <rect x="216" y="328" width="28" height="28" rx="8" fill="#060314" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="230" y="346" text-anchor="middle" font-size="16">🔬</text>
  </g>
  <g class="cni" style="transform-origin:108px 220px">
    <rect x="94" y="206" width="28" height="28" rx="8" fill="#060314" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="108" y="224" text-anchor="middle" font-size="16">🤖</text>
  </g>
</g>

<!-- ── ORBIT RING 2 (outer, 165px radius) ── -->
<g class="oo">
  <circle cx="230" cy="220" r="166" fill="none" stroke="#06b6d4" stroke-width=".5" stroke-dasharray="2,10" opacity=".2"/>
  <g class="cno" style="transform-origin:230px 54px">
    <rect x="216" y="40" width="28" height="28" rx="8" fill="#060314" stroke="#06b6d4" stroke-width="1"/>
    <text x="230" y="58" text-anchor="middle" font-size="15">🐍</text>
  </g>
  <g class="cno" style="transform-origin:396px 220px">
    <rect x="382" y="206" width="28" height="28" rx="8" fill="#060314" stroke="#06b6d4" stroke-width="1"/>
    <text x="396" y="224" text-anchor="middle" font-size="15">🔥</text>
  </g>
  <g class="cno" style="transform-origin:230px 386px">
    <rect x="216" y="372" width="28" height="28" rx="8" fill="#060314" stroke="#06b6d4" stroke-width="1"/>
    <text x="230" y="390" text-anchor="middle" font-size="15">🧬</text>
  </g>
  <g class="cno" style="transform-origin:64px 220px">
    <rect x="50" y="206" width="28" height="28" rx="8" fill="#060314" stroke="#06b6d4" stroke-width="1"/>
    <text x="64" y="224" text-anchor="middle" font-size="15">📡</text>
  </g>
</g>

<!-- ── BOT ── -->
<g class="bot-g">

  <!-- shadow -->
  <ellipse class="shad-e" cx="230" cy="392" rx="52" ry="7" fill="url(#shad-g)" filter="url(#f1)"/>

  <!-- antenna -->
  <line x1="230" y1="100" x2="230" y2="68" stroke="url(#agrad)" stroke-width="3.5" stroke-linecap="round"/>
  <circle class="ant-d" cx="230" cy="62" r="6" fill="#67e8f9" filter="url(#f2)"/>
  <circle cx="230" cy="62" r="14" fill="#06b6d4" opacity="0.14" filter="url(#f3)">
    <animate attributeName="r" values="11;17;11" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.09;0.22;0.09" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- ears -->
  <rect x="126" y="128" width="20" height="42" rx="9" fill="#100828" stroke="#2d1f6e" stroke-width="1.5"/>
  <rect x="131" y="138" width="8" height="12" rx="3.5" fill="#7c3aed" opacity="0.6"/>
  <rect x="314" y="128" width="20" height="42" rx="9" fill="#100828" stroke="#2d1f6e" stroke-width="1.5"/>
  <rect x="321" y="138" width="8" height="12" rx="3.5" fill="#7c3aed" opacity="0.6"/>

  <!-- head shell -->
  <rect x="138" y="100" width="184" height="130" rx="26" fill="url(#hgrad)" stroke="#2d1f6e" stroke-width="1.5"/>
  <!-- face plate -->
  <rect x="146" y="110" width="168" height="112" rx="16" fill="url(#fgrad)"/>
  <!-- face rim glow -->
  <rect x="146" y="110" width="168" height="112" rx="16" fill="none" stroke="#7c3aed" stroke-width=".7" opacity=".5"/>

  <!-- scanline -->
  <rect class="scan" x="148" y="140" width="164" height="5" rx="2" fill="#67e8f9" opacity=".45" clip-path="url(#fc)"/>

  <!-- eye sockets -->
  <rect x="157" y="138" width="54" height="34" rx="14" fill="#05020e" stroke="#2d1f6e" stroke-width="1"/>
  <rect x="249" y="138" width="54" height="34" rx="14" fill="#05020e" stroke="#2d1f6e" stroke-width="1"/>

  <!-- eye halos -->
  <ellipse cx="184" cy="155" rx="19" ry="13" fill="url(#ehalo)"/>
  <ellipse cx="276" cy="155" rx="19" ry="13" fill="url(#ehalo)"/>

  <!-- pupils -->
  <circle class="eye-l" cx="184" cy="155" r="8" fill="url(#egrad)" filter="url(#f1)"/>
  <circle class="eye-r" cx="276" cy="155" r="8" fill="url(#egrad)" filter="url(#f1)"/>
  <!-- shine -->
  <circle cx="187" cy="152" r="2.5" fill="white" opacity="0.5"/>
  <circle cx="279" cy="152" r="2.5" fill="white" opacity="0.5"/>

  <!-- status bar -->
  <rect x="168" y="196" width="124" height="14" rx="6" fill="#05020e" stroke="#2d1f6e" stroke-width="1"/>
  <rect x="170" y="198" width="0" height="10" rx="4" fill="url(#cgrad)" opacity=".9" clip-path="url(#sc)">
    <animate attributeName="width" values="0;118;0" dur="3.2s" repeatCount="indefinite"/>
  </rect>
  <text x="230" y="208" text-anchor="middle" font-size="7.5" fill="#67e8f9" font-family="monospace" opacity=".65">PROCESSING</text>

  <!-- neck -->
  <rect x="198" y="230" width="64" height="16" rx="7" fill="#100828" stroke="#2d1f6e" stroke-width="1"/>
  <rect x="204" y="234" width="9" height="9" rx="3" fill="#7c3aed" opacity=".55"/>
  <rect x="220" y="234" width="9" height="9" rx="3" fill="#06b6d4" opacity=".55"/>
  <rect x="247" y="234" width="9" height="9" rx="3" fill="#7c3aed" opacity=".55"/>

  <!-- body -->
  <rect x="144" y="246" width="172" height="82" rx="22" fill="url(#hgrad)" stroke="#2d1f6e" stroke-width="1.5"/>
  <rect x="156" y="258" width="148" height="58" rx="12" fill="#05020e"/>

  <!-- circuit lines -->
  <line x1="174" y1="287" x2="286" y2="287" stroke="#1e1252" stroke-width="1" opacity=".8"/>
  <line x1="174" y1="276" x2="230" y2="276" stroke="#1e1252" stroke-width="1" opacity=".6"/>
  <line x1="230" y1="298" x2="286" y2="298" stroke="#1e1252" stroke-width="1" opacity=".6"/>
  <circle cx="174" cy="276" r="2.5" fill="#2d1f6e"/>
  <circle cx="286" cy="298" r="2.5" fill="#2d1f6e"/>
  <circle cx="230" cy="287" r="2.5" fill="#2d1f6e"/>

  <!-- core -->
  <circle cx="230" cy="287" r="19" fill="#05020e" stroke="#7c3aed" stroke-width="1.5"/>
  <circle class="core-c" cx="230" cy="287" r="9" fill="url(#cgrad)" filter="url(#f2)"/>
  <circle cx="230" cy="287" r="19" fill="#7c3aed" opacity=".05" filter="url(#f3)">
    <animate attributeName="r" values="17;24;17" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- side dots -->
  <circle class="dot-l" cx="172" cy="287" r="5.5" fill="#a78bfa" filter="url(#f1)"/>
  <circle class="dot-r" cx="288" cy="287" r="5.5" fill="#67e8f9" filter="url(#f1)"/>

  <!-- bolts -->
  <circle cx="162" cy="264" r="3.5" fill="#160c38" stroke="#2d1f6e" stroke-width="1"/>
  <circle cx="298" cy="264" r="3.5" fill="#160c38" stroke="#2d1f6e" stroke-width="1"/>
  <circle cx="162" cy="320" r="3.5" fill="#160c38" stroke="#2d1f6e" stroke-width="1"/>
  <circle cx="298" cy="320" r="3.5" fill="#160c38" stroke="#2d1f6e" stroke-width="1"/>

</g>

<!-- ── WELCOME TEXT ── -->
<rect x="120" y="412" width="220" height="30" rx="15" fill="#060314" stroke="#7c3aed" stroke-width=".8" opacity=".8">
  <animate attributeName="stroke" values="#7c3aed;#06b6d4;#7c3aed" dur="3s" repeatCount="indefinite"/>
</rect>
<text class="wt" x="230" y="432" text-anchor="middle"
  font-size="11.5" font-family="monospace" letter-spacing="3.5"
  fill="#a78bfa" font-weight="600">◆  WELCOME TO MY PROFILE  ◆</text>

<text x="230" y="462" text-anchor="middle"
  font-size="10" font-family="monospace" letter-spacing="2"
  fill="#2d1f6e" opacity=".9">AI ENGINEER  ·  CELLOGEN THERAPEUTICS</text>

<!-- bottom line accent -->
<line x1="80" y1="474" x2="380" y2="474" stroke="url(#shad-g)" stroke-width=".8" opacity=".5"/>

</svg>
